services:
  # ─────────────────────────────────────────────
  # PostgreSQL — Base de données locale (dev uniquement)
  # En production : Neon Cloud PostgreSQL est utilisé
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: immogest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immogest}
      POSTGRES_USER: ${POSTGRES_USER:-immogest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ImmoGest@2025!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - immogest_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immogest_user} -d ${POSTGRES_DB:-immogest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # pgAdmin — Interface d'administration PostgreSQL
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: immogest_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@immogest.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@2025!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - immogest_network

# ─────────────────────────────────────────────
# Volumes persistants
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# ─────────────────────────────────────────────
# Réseau interne
# ─────────────────────────────────────────────
networks:
  immogest_network:
    driver: bridge
