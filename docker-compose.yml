services:
  # ─────────────────────────────────────────────
  # PostgreSQL — Base de données principale
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: immogest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-immogest}
      POSTGRES_USER: ${POSTGRES_USER:-immogest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ImmoGest@2025!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - immogest_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-immogest_user} -d ${POSTGRES_DB:-immogest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # pgAdmin — Interface d'administration PostgreSQL
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: immogest_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@immogest.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin@2025!}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - immogest_network

  # ─────────────────────────────────────────────
  # Backend — API .NET 8
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immogest_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-immogest};Username=${POSTGRES_USER:-immogest_user};Password=${POSTGRES_PASSWORD:-ImmoGest@2025!}"
      JWT__Secret: ${JWT_SECRET:-ImmoGestSuperSecretKey2025!@#ChangeThisInProduction}
      JWT__Issuer: ${JWT_ISSUER:-ImmoGest}
      JWT__Audience: ${JWT_AUDIENCE:-ImmoGestClients}
      JWT__ExpirationHours: ${JWT_EXPIRATION_HOURS:-24}
      AllowedOrigins: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-5055}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - immogest_network
    volumes:
      - api_uploads:/app/uploads

  # ─────────────────────────────────────────────
  # Frontend — Next.js 14
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5055}
    container_name: immogest_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5055}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - immogest_network

# ─────────────────────────────────────────────
# Volumes persistants
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  api_uploads:
    driver: local

# ─────────────────────────────────────────────
# Réseau interne
# ─────────────────────────────────────────────
networks:
  immogest_network:
    driver: bridge
